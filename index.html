<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover enables edge-to-edge drawing into notches and island cutouts -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">

    <!-- PWA & Standalone iOS Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Loyal">
    <meta name="format-detection" content="telephone=no">

    <!-- Web Manifest & Favicons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/loyal_fav_icon.png">
    <link rel="apple-touch-icon" href="/loyal_icon_192.png">

    <title>Loyal | Your Digital Wallet</title>

    <!-- Prevent flash of unstyled theme on boot -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem("loyal_theme") || "system";
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (savedTheme === "dark" || (savedTheme === "system" && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>

<body>
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>

    <script type="module">
        import { registerSW } from 'virtual:pwa-register';
        registerSW({ immediate: true });
    </script>
</body>

</html>
